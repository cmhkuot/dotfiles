# Topgrade Configuration File
# Managed via dotfiles: ~/.dotfiles/config/topgrade.toml -> ~/.config/topgrade.toml

[misc]
# Cache sudo credentials at start to avoid prompts mid-run
pre_sudo = true

# Automatically clean up temporary or old files after upgrade (e.g. brew cleanup)
cleanup = true

# Display the elapsed execution time for each step
display_time = true

# Do not set terminal title
set_title = false

# Do not self-update Topgrade
no_self_update = true

# Disable steps that are unnecessary or managed separately
disable = [
  "pyenv",
  "conda",
  "mamba",
  "pip3",
  "uv",
  "vim",
  "containers",
  "gcloud",
  "node",
  "yarn",
  "pnpm",
  "skills",
  "vscode",
]

[brew]
# Automatically run `brew autoremove` after upgrading formulae
autoremove = true

# Upgrade casks that have auto-update enabled (e.g. Chrome, Brave)
greedy_auto_updates = false

# Upgrade formulae built from the HEAD branch
fetch_head = true

[git]
# Maximum parallel git operations when pulling repositories
max_concurrency = 5

# Repositories to update automatically during topgrade run
repos = [
  "~/.dotfiles"
]

[commands]
# Custom update commands to run during Topgrade execution
# "Update Antidote Zsh Plugins" = "zsh -c 'source /opt/homebrew/opt/antidote/share/antidote/antidote.zsh && antidote update'"
